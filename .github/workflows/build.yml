name: Build & Push — Images BD

# Publie deux images sur Docker Hub :
#   monolithoid/bd-a1111   → AUTOMATIC1111 + ControlNet (CPU)
#   monolithoid/bd-webapp  → FastAPI + Google SSO
#
# Secrets requis :
#   DOCKERHUB_USERNAME : monolithoid
#   DOCKERHUB_TOKEN    : Docker Hub → Account Settings → Security → New Access Token

on:
  push:
    branches:
      - main
    paths:
      - 'a1111/**'
      - 'webapp/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bd-webapp
            image: monolithoid/bd-webapp
            context: ./webapp
            dockerfile: ./webapp/Dockerfile

          - name: bd-a1111
            image: monolithoid/bd-a1111
            context: ./a1111
            dockerfile: ./a1111/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=build-${{ github.run_number }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          platforms: linux/amd64
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        run: |
          echo "## ${{ matrix.name }} publié" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Commande |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| latest | \`docker pull ${{ matrix.image }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| build  | \`docker pull ${{ matrix.image }}:build-${{ github.run_number }}\` |" >> $GITHUB_STEP_SUMMARY
