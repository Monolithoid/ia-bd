version: "3.8"

# ============================================================
# STACK MonooBD — monoobd.${DOMAIN}
# ============================================================
#
# Exposé publiquement :
#   monoobd.${DOMAIN}   → Application web (upload + preview côte à côte)
#
# Service interne :
#   a1111               → AUTOMATIC1111 API REST (port 7860, CPU uniquement)
#
# Volumes persistants sous /opt/ia/bd/ (survivent aux redémarrages) :
#   models/     → modèles Stable Diffusion + ControlNet (~5 Go, téléchargés 1 fois)
#   outputs/    → images générées (historique)
#   cn-cache/   → preprocesseurs ControlNet (HED, Lineart…)
#   sessions/   → sessions webapp (pas de re-login après redémarrage)
#   projects/   → projets BD (JSON, appartient à l’utilisateur node)
#
# Variables à configurer dans Coolify → Environment Variables :
#   DOMAIN               : monolithoid.com
#   DOCKERHUB_USERNAME   : ton username Docker Hub
#   OAUTH_CLIENT_ID      : Google Cloud Console → OAuth 2.0 → Client ID
#   OAUTH_CLIENT_SECRET  : idem → Client Secret
#   SESSION_SECRET       : openssl rand -hex 32
#   ALLOWED_EMAIL        : ton adresse Gmail autorisée
#   SD_EXTRA_ARGS        : (optionnel) args supplémentaires pour A1111
#
# URI de redirection OAuth à configurer dans Google Cloud Console :
#   https://monoobd.monolithoid.com/auth
#
# Avant de déployer :
#   sudo bash setup-vps.sh
# ============================================================

services:

  # ----------------------------------------------------------
  # AUTOMATIC1111 — moteur img2img + ControlNet
  # CPU uniquement — générations lentes (10-30 min)
  # Premier démarrage : télécharge ~5 Go de modèles automatiquement
  # ----------------------------------------------------------
  a1111:
    image: ${DOCKERHUB_USERNAME}/bd-a1111:latest
    container_name: bd-a1111
    restart: unless-stopped
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - /opt/ia/bd/models:/app/stable-diffusion-webui/models
      - /opt/ia/bd/outputs:/app/stable-diffusion-webui/outputs
      - /opt/ia/bd/cn-cache:/app/stable-diffusion-webui/extensions/sd-webui-controlnet/annotator/ckpts
    environment:
      - SD_EXTRA_ARGS=${SD_EXTRA_ARGS:-}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    mem_limit: 18g
    networks:
      - bd-network

  # ----------------------------------------------------------
  # MONOOBD WEBAPP — interface upload + prévisualisation côte à côte
  # Google SSO — accès réservé à ${ALLOWED_EMAIL}
  # Exposé via Traefik sous monoobd.${DOMAIN}
  # ----------------------------------------------------------
  webapp:
    image: ${DOCKERHUB_USERNAME}/bd-webapp:latest
    container_name: monoobd-webapp
    restart: unless-stopped
    volumes:
      - /opt/ia/bd/sessions:/data/sessions
      - /opt/ia/bd/projects:/data/projects
    environment:
      - A1111_URL=http://a1111:7860
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - ALLOWED_EMAIL=${ALLOWED_EMAIL}
      - DOMAIN=${DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.monoobd.rule=Host(`monoobd.${DOMAIN}`)"
      - "traefik.http.routers.monoobd.entrypoints=https"
      - "traefik.http.routers.monoobd.tls.certresolver=letsencrypt"
      - "traefik.http.services.monoobd.loadbalancer.server.port=8080"
    depends_on:
      - a1111
    networks:
      - bd-network
      - coolify

networks:
  bd-network:
    driver: bridge
  coolify:
    external: true
