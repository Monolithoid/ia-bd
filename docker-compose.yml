version: "3.8"

# ============================================================
# STACK MonooBD — monoobd.${DOMAIN}
# ============================================================
#
# Exposé publiquement :
#   monoobd.${DOMAIN}   → Application web (upload + preview côte à côte)
#
# Service interne :
#   inference           → Microserveur HuggingFace Diffusers (port 8000, CPU)
#
# Volumes persistants sous /opt/ia/bd/ (survivent aux redémarrages) :
#   models/     → cache HuggingFace (SD 1.5 + ControlNet, ~5 Go, téléchargés 1 fois)
#   outputs/    → images générées (historique)
#   sessions/   → sessions webapp (pas de re-login après redémarrage)
#
# Variables à configurer dans Coolify → Environment Variables :
#   DOMAIN               : monolithoid.com
#   DOCKERHUB_USERNAME   : ton username Docker Hub
#   OAUTH_CLIENT_ID      : Google Cloud Console → OAuth 2.0 → Client ID
#   OAUTH_CLIENT_SECRET  : idem → Client Secret
#   SESSION_SECRET       : openssl rand -hex 32
#   ALLOWED_EMAIL        : ton adresse Gmail autorisée
#
# Avant de déployer :
#   sudo bash setup-vps.sh
# ============================================================

services:

  # ----------------------------------------------------------
  # INFERENCE — microserveur Diffusers img2img + ControlNet
  # CPU uniquement — générations lentes (10-30 min)
  # Premier démarrage : télécharge ~5 Go de modèles depuis HuggingFace
  # ----------------------------------------------------------
  inference:
    image: ${DOCKERHUB_USERNAME}/bd-inference:latest
    container_name: bd-inference
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /opt/ia/bd/models:/models
      - /opt/ia/bd/outputs:/outputs
    environment:
      - HF_HOME=/models/hf-cache
      - PRELOAD_MODES=${PRELOAD_MODES:-}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    mem_limit: 18g
    networks:
      - bd-network

  # ----------------------------------------------------------
  # MONOOBD WEBAPP — interface upload + prévisualisation côte à côte
  # Google SSO — accès réservé à ${ALLOWED_EMAIL}
  # Exposé via Traefik sous monoobd.${DOMAIN}
  # ----------------------------------------------------------
  webapp:
    image: ${DOCKERHUB_USERNAME}/bd-webapp:latest
    container_name: monoobd-webapp
    restart: unless-stopped
    volumes:
      - /opt/ia/bd/sessions:/data/sessions
      - /opt/ia/bd/outputs:/data/projects
    environment:
      - INFERENCE_URL=http://inference:8000
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - ALLOWED_EMAIL=${ALLOWED_EMAIL}
      - DOMAIN=${DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.monoobd.rule=Host(`monoobd.${DOMAIN}`)"
      - "traefik.http.routers.monoobd.entrypoints=https"
      - "traefik.http.routers.monoobd.tls.certresolver=letsencrypt"
      - "traefik.http.services.monoobd.loadbalancer.server.port=8080"
    depends_on:
      - inference
    networks:
      - bd-network
      - coolify

networks:
  bd-network:
    driver: bridge
  coolify:
    external: true
